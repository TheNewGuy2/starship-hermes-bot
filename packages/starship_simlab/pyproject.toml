[project]
name = "starship-simlab"
version = "1.0.0"
description = "Starship Alpha SimLab (backtests)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "starship-engine",
  "starship-shared",
  "numpy",
  "requests",
  "yfinance",
  "matplotlib",
  "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starship_simlab"]

[project.scripts]
alpha-sim = "starship_simlab.cli:main"
