[project]
name = "starship-reports"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "starship-shared",
  "starship-engine",
  "matplotlib>=3.8",
]

[project.scripts]
starship-report = "starship_reports.report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starship_reports"]
