[project]
name = "starship-shared"
version = "1.0.0"
description = "Shared schemas and helpers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starship_shared"]
