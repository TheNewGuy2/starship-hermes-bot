[project]
name = "starship-engine"
version = "1.0.0"
description = "Starship Alpha engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "starship-shared",
  "starship-web",
  "tastytrade",
  "numpy",
  "requests",
  "requests-oauthlib",
  "python-dotenv",
  "rich",
  "typer",
  "matplotlib",
  "yfinance",
  "pydantic",
  "PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starship_engine"]

[project.scripts]
bot = "starship_engine.runner:main"
cli = "starship_engine.cli:main"
