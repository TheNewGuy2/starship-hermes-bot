schema_version: 1
suite_name: "ic_filter_phase25"

defaults:
  plugin: "alpha_sim_lab.ic_filter"
  mode: "pnl"
  phase: 2.5

  data_source: "yahoo"
  symbol: "^GSPC"
  vix_symbol: "^VIX"
  start: "2016-01-01"
  end: "2026-01-29"

  vrp_min: 1.25
  rv60_min: 0.05
  mr_max: 0.05

  loss_model: "scaled"
  loss_floor_r: 1.0
  max_loss_r: 2.0
  stop_r: 1.5
  warmup_entry_mode: "slot_proxy"
  warmup_skip_first_trade: true
  earliest_entry_time_cst: "10:50"

